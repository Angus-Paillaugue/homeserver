events {
  worker_connections 1024;
}

http {
  include mime.types;
  sendfile on;
  tcp_nopush on;

  server {
    listen 8080;
    listen [::]:8080;

    resolver 127.0.0.11;
    autoindex on;

    server_name file-transfer.paillaugue.fr;
    server_tokens off;

    root /app/static;
    gzip_static on;

    location / {
      try_files $uri $uri/ =404;
    }
    location "/shows/South Park/Season 29/s29e4.mkv" {
      add_header Content-disposition "attachment; filename=$1";
      add_header Content-type "application/octet-stream";
    }
  }
}
