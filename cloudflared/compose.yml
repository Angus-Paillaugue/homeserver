
services:
 cloudflare-tunnel:
   image: cloudflare/cloudflared:latest
   container_name: cloudflare-tunnel
   restart: unless-stopped
   network_mode: "host"
   command: tunnel run
   volumes:
     - /etc/localtime:/etc/localtime:ro
   environment:
     - "TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}"
   healthcheck:
     test: ["CMD", "cloudflared", "--version"]
     interval: 30s
     timeout: 10s
     retries: 3
     start_period: 10s
