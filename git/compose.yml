networks:
  gitea:
    external: false

services:
  server:
    image: docker.gitea.com/gitea:${GITEA_VERSION}
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=${POSTGRES_DB}
      - GITEA__database__USER=${POSTGRES_USER}
      - GITEA__database__PASSWD=${POSTGRES_PASSWORD}
      - GITEA__metrics__ENABLED=true
      - GITEA__metrics__ENABLED_ISSUE_BY_REPOSITORY=true
      - GITEA__metrics__ENABLED_ISSUE_BY_LABEL=true
      - GITEA__metrics__TOKEN=${GITEA_METRICS_TOKEN}
      - GITEA__actions__ENABLED=true
      - GITEA__server__SSH_PORT=222
      - GITEA__ui__THEME=${GITEA__ui__THEME?:gitea-auto,gitea-light,gitea-dark}
      - GITEA__ui__DEFAULT_THEME=${GITEA__ui__DEFAULT_THEME?:gitea-auto}
    restart: always
    networks:
      - gitea
    volumes:
      - ./gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 4323:3000
      - 222:22
    depends_on:
      - db
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=3", "--spider", "http://localhost:3000/api/healthz" ]
      interval: 10s
      retries: 10
      timeout: 5s
      start_period: 200s

  runner:
    image: docker.io/gitea/runner:${GITEA_RUNNER_VERSION}
    restart: always
    container_name: gitea-runner
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: "https://gitea.home.paillaugue.fr"
      GITEA_RUNNER_REGISTRATION_TOKEN: "${RUNNER_REGISTRATION_TOKEN}"
      GITEA_RUNNER_NAME: "runner-1"
    ports:
      - 9101:9101
    depends_on:
      server:
        condition: service_healthy
        restart: true
    volumes:
      - ./gitea-runner/data:/data
      - ./gitea-runner/cache:/cache/actcache
      - ./gitea-runner/config.yml:/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gitea
      - default
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  db:
    image: docker.io/library/postgres:18
    restart: always
    container_name: gitea-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - gitea
    volumes:
      - ./postgres_18:/var/lib/postgresql
     
  # renovate:
  #   image: renovate/renovate
  #   container_name: renovate
  #   restart: always
  #   volumes:
  #     - ./renovate/config.ts:/usr/src/app/config.ts
  #   environment:
  #     - RENOVATE_TOKEN=${RENOVATE_TOKEN}
  #     - RENOVATE_CONFIG_FILE=/usr/src/app/config.ts
  #   networks:
  #     - gitea

  gitea-mirror:
    image: ghcr.io/raylabshq/gitea-mirror:latest
    container_name: gitea-mirror
    restart: unless-stopped
    ports:
      - 4321:4321
    user: 0:0
    volumes:
      - ./gitea-mirror:/app/data
    environment:
      # === ABSOLUTELY REQUIRED ===
      # This MUST be set and CANNOT be changed via UI
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://gitea-mirror.home.paillaugue.fr
      - BETTER_AUTH_TRUSTED_ORIGINS=https://gitea-mirror.home.paillaugue.fr
      # === CORE SETTINGS ===
      # These are technically required but have working defaults
      - NODE_ENV=production
      - DATABASE_URL=file:data/gitea-mirror.db
      - HOST=0.0.0.0
      - PORT=4321
      - PUBLIC_BETTER_AUTH_URL=https://gitea-mirror.home.paillaugue.fr
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=3
        - --spider
        - http://localhost:4321/api/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
